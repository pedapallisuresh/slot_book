services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: slot, POSTGRES_DB: slotbook }
    ports: ["5433:5432"]                 # host port 5433 avoids clashing with a local Postgres
    volumes: ["./migrations:/docker-entrypoint-initdb.d:ro"]   # schema + seed run on first start
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d slotbook"], interval: 2s, retries: 30 }
  app:
    build: .
    environment: { DATABASE_URL: "postgres://postgres:slot@db:5432/slotbook" }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
